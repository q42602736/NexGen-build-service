name: probe6-on
on:
  workflow_dispatch:
    inputs:
      client:
        description: '客户端类型'
        required: false
        type: string
        default: 'nexgen_react'
      profile:
        description: '配置档案名称'
        required: true
        type: string
      profile_branch:
        description: '配置档案分支'
        required: false
        type: string
        default: 'profiles'
      tag:
        description: '构建版本号'
        required: true
        type: string
      branch:
        description: 'NexGen-client-React 源码分支'
        required: false
        type: string
        default: 'xiaov2board/Xboard'
      core:
        description: '固定为 nexgen'
        required: false
        type: string
        default: 'nexgen'
      platforms:
        description: '选择平台：all, windows, windows-amd64, windows-arm64, android, android-tv, linux（双架构全部格式）, macos, macos-amd64, macos-arm64'
        required: true
        type: string
        default: 'all'
      request_id:
        description: '构建请求唯一标识'
        required: false
        type: string
jobs:
  hi:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
