on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        family: [android]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Diagnose NexGen Build Failure
        if: failure()
        shell: bash
        run: "echo \"=== Matrix ===\"\necho \"platform=${{ matrix.platform }}\"\necho \"family=${{ matrix.family }}\"\necho \"arch=${{ matrix.arch }}\"\necho \"\"\n\necho \"=== Tool Versions ===\"\nnode --version || true\nnpm --version || true\nrustc --version || true\ncargo --version || true\ngo version || true\necho \"\"\n\necho \"=== Go Env (mihomo) ===\"\nif [ -d source/core/mihomo ]; then\n  (cd source/core/mihomo && go env GOVERSION GOMOD GOPROXY GOMODCACHE GOCACHE GOOS GOARCH CGO_ENABLED) || true\nelse\n  echo \"source/core/mihomo 不存在\"\nfi\necho \"\"\n\necho \"=== Core Output Files ===\"\nfind source/core -maxdepth 5 -type f \\( -name \"*.exe\" -o -name \"core-manifest.json\" -o -name \"*.so\" -o -name \"*.dylib\" \\) -print 2>/dev/null || true\necho \"\"\n\necho \"=== 客户端安装包与后台产物 ===\"\nfind source/dist source/release/windows source/.nexgen/electron source/src-tauri/target -maxdepth 6 -type f 2>/dev/null | tail -100 || true\n"
      - name: Report Platform Failed
        if: failure()
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM_LABEL: ${{ matrix.platform }}
          PLATFORM_KEY: ${{ matrix.platform }}
        shell: bash
        run: "CALLBACK_URL=\"${CONFIG_SERVER_URL%/}/api/internal/build-events/progress\"\nPAYLOAD=$(node -e '\n  const label = process.env.PLATFORM_LABEL || \"客户端\";\n  const payload = {\n    request_id: process.env.REQUEST_ID,\n    run_id: Number(process.env.RUN_ID || 0),\n    run_url: process.env.RUN_URL || \"\",\n    status: \"in_progress\",\n    progress_percent: 80,\n    progress_stage: \"build\",\n    progress_text: \"\",\n    progress_detail: {\n      key: process.env.PLATFORM_KEY || label,\n      label,\n      status: \"completed\",\n      conclusion: \"failure\",\n      stage: \"completed\",\n      text: \"\"\n    }\n  };\n  process.stdout.write(JSON.stringify(payload));\n')\ncommand curl -fsS -X POST \"$CALLBACK_URL\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN\" \\\n  -d \"$PAYLOAD\" || true\n"
      - name: Upload Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          UPLOAD_URL: ${{ needs.prepare-release.outputs.upload_url }}
          APP_NAME: ${{ needs.prepare-release.outputs.app_name }}
          SAFE_APP_NAME: ${{ needs.prepare-release.outputs.safe_app_name }}
          VERSION: ${{ github.event.inputs.tag }}
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM_LABEL: ${{ matrix.platform }}
          PLATFORM_KEY: ${{ matrix.platform }}
        run: "report_build_progress() {\n  local detail_status=\"$1\"\n  local detail_stage=\"$2\"\n  local detail_text=\"$3\"\n  local detail_conclusion=\"${4:-}\"\n  local overall_progress=\"${5:-75}\"\n  CALLBACK_URL=\"${CONFIG_SERVER_URL%/}/api/internal/build-events/progress\"\n  PAYLOAD=$(DETAIL_STATUS=\"$detail_status\" DETAIL_STAGE=\"$detail_stage\" DETAIL_TEXT=\"$detail_text\" DETAIL_CONCLUSION=\"$detail_conclusion\" OVERALL_PROGRESS=\"$overall_progress\" node -e '\n    const label = process.env.PLATFORM_LABEL || \"客户端\";\n    const payload = {\n      request_id: process.env.REQUEST_ID,\n      run_id: Number(process.env.RUN_ID || 0),\n      run_url: process.env.RUN_URL || \"\",\n      status: \"in_progress\",\n      progress_percent: Number(process.env.OVERALL_PROGRESS || 75),\n      progress_stage: process.env.DETAIL_STAGE || \"upload\",\n      progress_text: \"\",\n      progress_detail: {\n        key: process.env.PLATFORM_KEY || label,\n        label,\n        status: process.env.DETAIL_STATUS || \"in_progress\",\n        conclusion: process.env.DETAIL_CONCLUSION || \"\",\n        stage: process.env.DETAIL_STAGE || \"\",\n        text: process.env.DETAIL_TEXT || \"\"\n      }\n    };\n    process.stdout.write(JSON.stringify(payload));\n  ')\n  command curl -fsS -X POST \"$CALLBACK_URL\" \\\n    -H \"Content-Type: application/json\" \\\n    -H \"X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN\" \\\n    -d \"$PAYLOAD\" || true\n}\n\ntrap 'report_build_progress \"completed\" \"completed\" \"\" \"failure\" \"80\"' ERR\nreport_build_progress \"in_progress\" \"upload\" \"\" \"\" \"75\"\n\nif [ ! -d \"source/dist\" ]; then\n  echo \"::error::未找到 source/dist 目录\"\n  exit 1\nfi\n\nif [ -z \"$SAFE_APP_NAME\" ]; then\n  echo \"::error::未能解析 NexGen 安全产物名：$APP_NAME\"\n  exit 1\nfi\nnormalize_nexgen_artifact_names() {\n  local file base normalized suffix prefix\n  for file in source/dist/*.pkg source/dist/*.dmg source/dist/*.apk source/dist/*.exe source/dist/*.msi source/dist/*.deb source/dist/*.rpm source/dist/*.AppImage; do\n    [ -f \"$file\" ] || continue\n    base=\"$(basename \"$file\")\"\n    case \"$base\" in\n      *macos-amd64*.pkg) prefix=\"$SAFE_APP_NAME\"; suffix=\"macos-amd64.pkg\" ;;\n      *macos-arm64*.pkg) prefix=\"$SAFE_APP_NAME\"; suffix=\"macos-arm64.pkg\" ;;\n      *macos-amd64*.dmg) prefix=\"$SAFE_APP_NAME\"; suffix=\"macos-amd64.dmg\" ;;\n      *macos-arm64*.dmg) prefix=\"$SAFE_APP_NAME\"; suffix=\"macos-arm64.dmg\" ;;\n      *android-tv-arm64-v8a*.apk|*tv-arm64-v8a*.apk) prefix=\"$SAFE_APP_NAME\"; suffix=\"android-tv-arm64-v8a.apk\" ;;\n      *android-tv-armeabi-v7a*.apk|*tv-armeabi-v7a*.apk) prefix=\"$SAFE_APP_NAME\"; suffix=\"android-tv-armeabi-v7a.apk\" ;;\n      *android-arm64-v8a*.apk|*arm64-v8a*.apk) prefix=\"$SAFE_APP_NAME\"; suffix=\"android-arm64-v8a.apk\" ;;\n      *android-armeabi-v7a*.apk|*armeabi-v7a*.apk) prefix=\"$SAFE_APP_NAME\"; suffix=\"android-armeabi-v7a.apk\" ;;\n      *android-universal*.apk|*universal*.apk) prefix=\"$SAFE_APP_NAME\"; suffix=\"android-universal.apk\" ;;\n      *-Electron-windows-x64-setup.exe) prefix=\"$SAFE_APP_NAME\"; suffix=\"Electron-windows-x64-setup.exe\" ;;\n      *-Electron-windows-x64-installer.msi) prefix=\"$SAFE_APP_NAME\"; suffix=\"Electron-windows-x64-installer.msi\" ;;\n      *-Electron-windows-arm64-setup.exe) prefix=\"$SAFE_APP_NAME\"; suffix=\"Electron-windows-arm64-setup.exe\" ;;\n      *-Electron-windows-arm64-installer.msi) prefix=\"$SAFE_APP_NAME\"; suffix=\"Electron-windows-arm64-installer.msi\" ;;\n      *windows-x64-setup.exe) prefix=\"$SAFE_APP_NAME\"; suffix=\"windows-x64-setup.exe\" ;;\n      *windows-arm64-setup.exe) prefix=\"$SAFE_APP_NAME\"; suffix=\"windows-arm64-setup.exe\" ;;\n      *windows-x64-installer.msi) prefix=\"$SAFE_APP_NAME\"; suffix=\"windows-x64-installer.msi\" ;;\n      *windows-arm64-installer.msi) prefix=\"$SAFE_APP_NAME\"; suffix=\"windows-arm64-installer.msi\" ;;\n      *-linux-amd64.deb|*-linux-amd64.rpm|*-linux-amd64.AppImage) prefix=\"$SAFE_APP_NAME\"; suffix=\"linux-amd64.${base##*.}\" ;;\n      *-linux-arm64.deb|*-linux-arm64.rpm|*-linux-arm64.AppImage) prefix=\"$SAFE_APP_NAME\"; suffix=\"linux-arm64.${base##*.}\" ;;\n      *) continue ;;\n    esac\n    normalized=\"source/dist/${prefix}-${VERSION}-${suffix}\"\n    if [ \"$file\" != \"$normalized\" ]; then\n      echo \"Renaming release artifact: $base -> $(basename \"$normalized\")\"\n      node -e 'require(\"fs\").renameSync(process.argv[1], process.argv[2])' \"$file\" \"$normalized\"\n    fi\n  done\n}\nnormalize_nexgen_artifact_names\n\nartifact_list=\"$(mktemp)\"\nupload_stage_dir=\"$(mktemp -d)\"\nupload_index=0\ncleanup_upload_stage() {\n  rm -rf \"$upload_stage_dir\"\n  rm -f \"$artifact_list\"\n}\ntrap cleanup_upload_stage EXIT\nfind source/dist -maxdepth 1 -type f \\( \\\n  -name \"*.pkg\" -o \\\n  -name \"*.dmg\" -o \\\n  -name \"*.exe\" -o \\\n  -name \"*.msi\" -o \\\n  -name \"*.apk\" -o \\\n  -name \"*.deb\" -o \\\n  -name \"*.rpm\" -o \\\n  -name \"*.AppImage\" \\\n\\) | sort > \"$artifact_list\"\nif [ \"$(wc -l < \"$artifact_list\" | tr -d ' ')\" = \"0\" ]; then\n  echo \"::error::未找到打包产物\"\n  find source/dist -maxdepth 2 -print 2>/dev/null || true\n  exit 1\nfi\n\nASSETS_RESPONSE=$(curl -sS --fail -H \"Authorization: token $GH_TOKEN\" \\\n  \"https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets\")\n\nwhile IFS= read -r file; do\n  [ -n \"$file\" ] || continue\n  base=\"$(basename \"$file\")\"\n  safe_base=\"$(echo \"$base\" | tr ' ' '-')\"\n  asset_name=\"$safe_base\"\n  content_type=\"application/octet-stream\"\n  case \"$asset_name\" in\n    *.pkg) content_type=\"application/octet-stream\" ;;\n    *.dmg) content_type=\"application/x-apple-diskimage\" ;;\n    *.exe) content_type=\"application/vnd.microsoft.portable-executable\" ;;\n    *.msi) content_type=\"application/x-msi\" ;;\n    *.apk) content_type=\"application/vnd.android.package-archive\" ;;\n  esac\n\n  printf '%s' \"$ASSETS_RESPONSE\" | node -e \"\n    const fs = require('fs');\n    const assetName = process.argv[1];\n    const version = process.argv[2];\n    const data = JSON.parse(fs.readFileSync(0, 'utf8'));\n    const candidates = new Set([assetName]);\n    const marker = version ? '-' + version + '-' : '';\n    const markerIndex = marker ? assetName.indexOf(marker) : -1;\n    if (markerIndex >= 0) {\n      candidates.add(assetName.slice(markerIndex));\n    }\n    for (const item of Array.isArray(data) ? data : []) {\n      const name = String((item && item.name) || '');\n      if (item && item.id && candidates.has(name)) {\n        process.stdout.write(String(item.id) + '\\t' + name + '\\n');\n      }\n    }\n  \" \"$asset_name\" \"$VERSION\" | while IFS=$'\\t' read -r existing_asset_id existing_asset_name; do\n    [ -n \"$existing_asset_id\" ] || continue\n    echo \"Deleting existing release asset: $existing_asset_name\"\n    curl -sS --fail -X DELETE -H \"Authorization: token $GH_TOKEN\" \\\n      \"https://api.github.com/repos/${{ github.repository }}/releases/assets/${existing_asset_id}\" > /dev/null\n  done\n\n  encoded_name=\"$(node -e 'console.log(encodeURIComponent(process.argv[1]))' \"$asset_name\")\"\n  upload_source=\"$file\"\n  if printf '%s' \"$file\" | LC_ALL=C grep -q '[^ -~]'; then\n    upload_index=$((upload_index + 1))\n    extension=\"${base##*.}\"\n    staged_source=\"$upload_stage_dir/asset-$(printf '%03d' \"$upload_index\").$extension\"\n    node -e 'require(\"fs\").copyFileSync(process.argv[1], process.argv[2])' \"$file\" \"$staged_source\"\n    upload_source=\"$staged_source\"\n    echo \"Using ASCII upload source for non-ASCII path: $asset_name\"\n  fi\n  echo \"Uploading release asset: $asset_name\"\n  upload_response=$(curl -sS --fail --http1.1 --retry 5 --retry-delay 2 --retry-all-errors -X POST \\\n    -H \"Authorization: token $GH_TOKEN\" \\\n    -H \"Content-Type: $content_type\" \\\n    -H \"Expect:\" \\\n    --upload-file \"$upload_source\" \\\n    \"${UPLOAD_URL}?name=${encoded_name}\")\n\n  uploaded_asset_id=$(printf '%s' \"$upload_response\" | node -e \"\n    const fs = require('fs');\n    const data = JSON.parse(fs.readFileSync(0, 'utf8'));\n    process.stdout.write(data && data.id ? String(data.id) : '');\n  \")\n  uploaded_asset_name=$(printf '%s' \"$upload_response\" | node -e \"\n    const fs = require('fs');\n    const data = JSON.parse(fs.readFileSync(0, 'utf8'));\n    process.stdout.write(data && data.name ? String(data.name) : '');\n  \")\n  uploaded_asset_state=$(printf '%s' \"$upload_response\" | node -e \"\n    const fs = require('fs');\n    const data = JSON.parse(fs.readFileSync(0, 'utf8'));\n    process.stdout.write(data && data.state ? String(data.state) : '');\n  \")\n  if [ -z \"$uploaded_asset_id\" ] || [ \"$uploaded_asset_name\" != \"$asset_name\" ] || [ \"$uploaded_asset_state\" != \"uploaded\" ]; then\n    echo \"::error::Release asset upload verification failed: $asset_name\"\n    echo \"$upload_response\"\n    exit 1\n  fi\ndone < \"$artifact_list\"\ncleanup_upload_stage\ntrap - EXIT\nreport_build_progress \"completed\" \"completed\" \"\" \"success\" \"80\"\n"