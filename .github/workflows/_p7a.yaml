on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 固定 Android Tauri CLI 版本
        if: matrix.family == 'android'
        working-directory: source
        env:
          NEXGEN_ANDROID_TAURI_CLI_VERSION: 2.12.4
        run: "cli_install_dir=\"$(mktemp -d \"$RUNNER_TEMP/nexgen-tauri-cli.XXXXXX\")\"\nprintf '{\"private\":true}\\n' > \"$cli_install_dir/package.json\"\nretry npm install --prefix \"$cli_install_dir\" --no-save --package-lock=false --ignore-scripts \"@tauri-apps/cli@$NEXGEN_ANDROID_TAURI_CLI_VERSION\"\nNEXGEN_ANDROID_TAURI_CLI_DIR=\"$cli_install_dir\" node - <<'NODE'\nconst fs = require(\"node:fs\");\nconst path = require(\"node:path\");\nconst isolatedCliPath = path.join(process.env.NEXGEN_ANDROID_TAURI_CLI_DIR, \"node_modules\", \"@tauri-apps\", \"cli\");\nconst version = JSON.parse(fs.readFileSync(path.join(isolatedCliPath, \"package.json\"), \"utf8\")).version;\nif (version !== process.env.NEXGEN_ANDROID_TAURI_CLI_VERSION) {\n  throw new Error(`Android Tauri CLI 版本不符合预期：${version}`);\n}\nconst localCliPath = path.resolve(\"node_modules\", \"@tauri-apps\", \"cli\");\nfs.rmSync(localCliPath, { recursive: true, force: true });\nfs.symlinkSync(isolatedCliPath, localCliPath, \"dir\");\nconst lockedPackages = JSON.parse(fs.readFileSync(\"package-lock.json\", \"utf8\")).packages;\nfor (const name of [\"@tauri-apps/api\", \"@tauri-apps/plugin-log\"]) {\n  const lockedVersion = lockedPackages[`node_modules/${name}`]?.version;\n  const installedVersion = JSON.parse(fs.readFileSync(path.join(\"node_modules\", name, \"package.json\"), \"utf8\")).version;\n  if (!lockedVersion || installedVersion !== lockedVersion) {\n    throw new Error(`Android 依赖版本偏离锁文件：${name}，预期 ${lockedVersion}，实际 ${installedVersion}`);\n  }\n  console.log(`Android 依赖版本核对通过：${name}@${installedVersion}`);\n}\nconsole.log(`Android Tauri CLI 版本：${version}`);\nNODE\n"
      - name: Warm Go Module Cache
        shell: bash
        run: "set -euo pipefail\n\nwarm_go_module() {\n  local module_dir=\"$1\"\n  if [ ! -f \"$module_dir/go.mod\" ]; then\n    echo \"跳过 Go module 预热，未找到 $module_dir/go.mod\"\n    return 0\n  fi\n\n  echo \"=== Go module 预热：$module_dir ===\"\n  (\n    cd \"$module_dir\"\n    go env GOVERSION GOMOD GOPROXY GOMODCACHE GOCACHE\n    retry go mod download\n    echo \"Go module 预热完成：$module_dir\"\n  )\n}\n\nwarm_go_module source/core/mihomo\nwarm_go_module source/core/android-bridge\n"
      - name: Apply Profile Config
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          PROFILE_NAME: ${{ github.event.inputs.profile }}
          PROFILE_BRANCH: ${{ github.event.inputs.profile_branch }}
        run: "PROFILE_PATH=\"profiles/$PROFILE_NAME.yaml\"\nENCODED_PROFILE_PATH=$(node -e \"console.log(process.argv[1].split('/').map(encodeURIComponent).join('/'))\" \"$PROFILE_PATH\")\nAPI_RESPONSE=$(curl -s -H \"Authorization: token $GH_TOKEN\" \\\n  \"https://api.github.com/repos/${PROFILE_REPO}/contents/${ENCODED_PROFILE_PATH}?ref=${PROFILE_BRANCH}\")\nif ! echo \"$API_RESPONSE\" | grep -q '\"content\"'; then\n  echo \"::error::读取配置档案失败：$PROFILE_PATH\"\n  printf \"%s\" \"$API_RESPONSE\" | node -e 'const fs=require(\"fs\"); const raw=fs.readFileSync(0,\"utf8\"); try { const data=JSON.parse(raw); console.log(JSON.stringify({message:data.message||\"\", status:data.status||\"\", documentation_url:data.documentation_url||\"\"})); } catch { console.log(String(raw).replace(/https?:\\/\\/\\S+/g,\"https://[redacted]\").slice(0,1000)); }'\n  exit 1\nfi\nprintf '%s' \"$API_RESPONSE\" | node -e \"\n  const fs = require('fs');\n  const data = JSON.parse(fs.readFileSync(0, 'utf8'));\n  process.stdout.write(Buffer.from(String(data.content || '').replace(/\\\\n/g, ''), 'base64').toString());\n\" > profile.yaml\nnode build-server/.github/scripts/nexgen-profile-to-config.mjs profile.yaml source/nexgen.config.yaml source/nexgen.config.yaml\n"
      - name: Apply App Version
        shell: bash
        run: node build-server/.github/scripts/apply-nexgen-version.mjs source "${{ github.event.inputs.tag }}"
      - name: Cache Android Rust Build
        if: matrix.family == 'android'
        uses: actions/cache@v4
        with:
          path: '~/.cargo/git
      
            ~/.cargo/registry
      
            source/src-tauri/target
      
            '
          key: ${{ runner.os }}-nexgen-react-android-rust-${{ hashFiles('source/src-tauri/Cargo.lock') }}
          restore-keys: '${{ runner.os }}-nexgen-react-android-rust-
      
            '
      - name: Cache Android Core Artifacts
        if: matrix.family == 'android'
        uses: actions/cache@v4
        with:
          path: source/core/android-libs
          key: ${{ runner.os }}-nexgen-react-android-core-${{ hashFiles('source/core/android-bridge/go.sum', 'source/core/android-bridge/**/*.go', 'source/core/mihomo/go.sum', 'source/core/mihomo/**/*.go', 'source/scripts/build-android-core.mjs') }}
          restore-keys: '${{ runner.os }}-nexgen-react-android-core-
      
            '
      - name: Warm Rust Crate Cache
        shell: bash
        run: "if [ -f source/src-tauri/Cargo.lock ]; then\n  (cd source/src-tauri && retry cargo fetch)\nelse\n  echo \"跳过 Rust crate 预热，未找到 source/src-tauri/Cargo.lock\"\nfi\n"
      - name: Install Image Tools
        shell: bash
        run: "case \"${{ runner.os }}\" in\n  Linux)\n    while IFS= read -r -d '' source_file; do\n      sudo sed -i \\\n        -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \\\n        -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \\\n        \"$source_file\"\n    done < <(sudo find /etc/apt -type f \\( -name '*.list' -o -name '*.sources' \\) -print0)\n    RETRY_LABEL=\"apt-get update\" retry timeout --signal=TERM 120s sudo apt-get update -y\n    RETRY_LABEL=\"apt-get install imagemagick\" retry timeout --signal=TERM 120s sudo apt-get install -y --no-install-recommends imagemagick\n    ;;\n  macOS)\n    retry brew install imagemagick\n    ;;\n  Windows)\n    retry choco install imagemagick -y --no-progress\n    powershell -NoProfile -Command '$dir = Get-ChildItem \"C:\\Program Files\" -Directory -Filter \"ImageMagick*\" | Select-Object -First 1; if ($dir) { Add-Content -Path $env:GITHUB_PATH -Value $dir.FullName }'\n    ;;\n  *)\n    echo \"::error::不支持的 runner 系统：${{ runner.os }}\"\n    exit 1\n    ;;\nesac\n"
      - name: 安装 Linux 桌面打包依赖
        if: matrix.family == 'linux'
        run: "retry sudo apt-get install -y --no-install-recommends \\\n  build-essential pkg-config curl wget file libwebkit2gtk-4.1-dev \\\n  libgtk-3-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \\\n  patchelf libfuse2 libcap2-bin policykit-1 xdg-utils gsettings-desktop-schemas \\\n  libsecret-tools gnome-keyring rpm squashfs-tools zsync\n"