on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        family: [android]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build Android Package
        if: matrix.family == 'android'
        working-directory: source
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -p=1
          NEXGEN_TARGET_PLATFORM: android
          NEXGEN_SKIP_DESKTOP_CORE_RESOURCE: '1'
          NEXGEN_ANDROID_SIGNING_BUNDLE: ${{ secrets.NEXGEN_ANDROID_SIGNING_BUNDLE }}
          RUST_BACKTRACE: full
        run: echo hi