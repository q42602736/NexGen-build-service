on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Apply App Icon
        shell: bash
        run: node build-server/.github/scripts/apply-nexgen-icon.mjs source
      - name: Build Windows Package
        if: matrix.family == 'windows'
        working-directory: source
        shell: pwsh
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -p=1
          WINDOWS_ARCH: ${{ matrix.arch }}
          WINDOWS_RUNTIME: ${{ steps.windows-runtime.outputs.runtime }}
        run: "$arch = if ($env:WINDOWS_ARCH -eq 'arm64') { 'arm64' } else { 'x64' }\n$target = if ($arch -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }\nif ($env:WINDOWS_RUNTIME -eq 'tauri') {\n  npm run desktop:core -- --target $target\n  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n}\n# Electron 入口内部会构建并校验当前架构的 Rust 宿主和 Mihomo 核心。\nif ($env:WINDOWS_RUNTIME -eq 'both') {\n  npm run package:windows -- --runtime both --targets $arch --bundles 'nsis,msi'\n} else {\n  npm run package:windows -- --targets $arch --bundles 'nsis,msi'\n}\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n$packages = @(\n  Get-ChildItem dist -File -Filter \"*-windows-$arch-setup.exe\"\n  Get-ChildItem dist -File -Filter \"*-windows-$arch-installer.msi\"\n)\n$expectedCount = if ($env:WINDOWS_RUNTIME -eq 'both') { 4 } else { 2 }\nif ($packages.Count -ne $expectedCount -or @($packages | Where-Object Length -eq 0).Count -ne 0) {\n  throw \"Windows 安装包缺失或数量异常，预期 $expectedCount 个 NSIS/MSI：$arch\"\n}\nif ($env:WINDOWS_RUNTIME -eq 'both') {\n  foreach ($extension in @('setup.exe', 'installer.msi')) {\n    $electronPackages = @($packages | Where-Object Name -Like \"*-Electron-windows-$arch-$extension\")\n    $tauriPackages = @($packages | Where-Object { $_.Name -like \"*-windows-$arch-$extension\" -and $_.Name -notlike \"*-Electron-windows-$arch-$extension\" })\n    if ($electronPackages.Count -ne 1 -or $tauriPackages.Count -ne 1) {\n      throw \"Tauri/Electron 安装包未成对生成：$arch $extension\"\n    }\n  }\n}\n$packages | Select-Object Name, Length\n"
      - name: Build macOS Package
        if: matrix.family == 'macos'
        working-directory: source
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -p=1
        run: "# appdmg 的 package.json 里声明了 os: darwin，放进 devDependencies 会让\n# ubuntu runner 的 npm ci 直接 EBADPLATFORM 失败，因此改为在 macOS runner 上全局安装。\nretry npm install -g appdmg@0.6.6\nexport PATH=\"$(npm prefix -g)/bin:$PATH\"\n\nnpm run desktop:core\n# 这里只出 app：dmg 与 pkg 由 scripts/tauri-wrapper.mjs 在 tauri build 后追加生成。\n# dmg 走 appdmg（直接写 .DS_Store，不经过 Finder），CI 无图形会话时也能有正确布局；\n# Tauri 内置的 dmg bundler 依赖 AppleScript 遥控 Finder，CI 上会被跳过导致无布局。\nif [ \"${{ matrix.platform }}\" = \"macos-arm64\" ]; then\n  npm run package:macos -- --targets arm64 --bundles app\nelse\n  npm run package:macos -- --targets amd64 --bundles app\nfi\n\ndmg_count=\"$(find dist -maxdepth 1 -type f -name \"*.dmg\" | wc -l | tr -d ' ')\"\nif [ \"$dmg_count\" = \"0\" ]; then\n  echo \"::error::macOS DMG 产物缺失，请检查 Tauri dmg 打包是否失败或被 --bundles 配置跳过。\"\n  find src-tauri/target -maxdepth 6 -type d -name dmg -print 2>/dev/null || true\n  find dist -maxdepth 1 -type f -print 2>/dev/null || true\n  exit 1\nfi\necho \"=== macOS artifacts ===\"\nls -lh dist/\n"
      - name: 构建 Linux 全部安装包
        if: matrix.family == 'linux'
        working-directory: source
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -p=1
          LINUX_ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: "# 使用各架构原生 runner，一次生成 DEB、RPM 和 AppImage。\nnpm run package:linux -- --targets \"$LINUX_ARCH\" --bundles deb,rpm,appimage\n\nshopt -s nullglob\nfor extension in deb rpm AppImage; do\n  packages=(dist/*-linux-\"$LINUX_ARCH\".\"$extension\")\n  if [ \"${#packages[@]}\" -ne 1 ] || [ ! -s \"${packages[0]}\" ]; then\n    echo \"::error::Linux 安装包缺失或数量异常：$LINUX_ARCH $extension，预期 1 个。\"\n    exit 1\n  fi\n  package_name=\"$(basename \"${packages[0]}\")\"\n  (cd dist && sha256sum -c \"${package_name}.sha256\")\ndone\necho \"Linux $LINUX_ARCH 的三种安装包已生成并通过校验。\"\nls -lh dist/*-linux-\"$LINUX_ARCH\".*\n"